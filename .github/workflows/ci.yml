name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # mp3gain 설치가 실패하면 이 단계에서 작업이 실패한다(대조 테스트를 조용히 건너뛰지 않게).
      - name: Install ffmpeg and mp3gain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mp3gain libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install ffmpeg and mp3gain (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg mp3gain
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Tool versions
        run: |
          ffmpeg -version | head -1
          if command -v mp3gain; then mp3gain -v 2>&1 || true; fi

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Generate fixtures
        run: python tests/_gen_fixtures.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # F6: Finder 로 띄운 앱처럼 셸 PATH 에 Homebrew 가 없어도 찾는지 확인.
      - name: Find ffmpeg without Homebrew on PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          PY="$(command -v python)"
          found="$(PATH=/usr/bin:/bin "$PY" -c 'from gaindb.decode import find_ffmpeg; print(find_ffmpeg())')"
          echo "$found"
          echo "$found" | grep -q "$(brew --prefix)/bin/ffmpeg"
