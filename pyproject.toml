[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaindb"
# NOTE: pre-release version. Before the public release, bump this to the
# final version (e.g. "0.5.0") and update VERSION in gaindb_cli.py to match.
version = "0.5.0.dev0"
description = "Lossless MP3 volume analysis and adjustment; an independent re-implementation compatible with mp3gain."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "META PUBLIC" }]
keywords = ["mp3", "replaygain", "loudness", "mp3gain", "lossless", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "PySide6>=6.7",
]

[tool.setuptools]
packages = ["gaindb", "gui", "gui.dialogs"]
py-modules = ["gaindb_cli"]