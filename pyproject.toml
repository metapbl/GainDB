[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaindb"
version = "0.6.0"
description = "Lossless MP3 volume analysis and adjustment; a Python re-implementation compatible with mp3gain."
readme = "README.md"
requires-python = ">=3.13"
license = "LGPL-2.1-or-later"
authors = [{ name = "META PUBLIC" }]
keywords = ["mp3", "replaygain", "loudness", "mp3gain", "lossless", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "PySide6>=6.7",
]

[tool.setuptools]
packages = ["gaindb", "gui", "gui.dialogs", "gui.assets", "gui.translations"]
py-modules = ["gaindb_cli"]

[tool.setuptools.package-data]
gui = ["assets/*.png", "translations/*.qm"]