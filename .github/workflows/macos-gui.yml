name: macOS GUI check

# D063: 실제 cocoa 플랫폼에서 GUI 흐름을 돌리고 캡처를 artifact 로 남긴다.
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Generate fixtures
        run: python tests/_gen_fixtures.py

      - name: Run GUI flow on the real platform
        run: python tests/_gui_capture.py gui-capture

      # 임시 코드는 이 러너 안에서만 넣는다(커밋하지 않음).
      - name: Build with PyInstaller and capture the built app
        run: |
          python -m pip install pyinstaller
          python tests/_theme_shot_patch.py
          pyinstaller --noconfirm GainDB.spec
          mkdir -p gui-capture/built
          THEME_SHOT="$PWD/gui-capture/built" ./dist/GainDB/GainDB
          ls gui-capture/built

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-gui-capture
          path: gui-capture
